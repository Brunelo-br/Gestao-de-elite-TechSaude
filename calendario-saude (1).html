<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechSaúde – Calendário de Saúde</title>
<style>
:root{
  --green-deep:#1e5631;
  --green-mid:#2d7a3e;
  --green-soft:#e8f5e9;
  --danger:#c41e3a;
  --bg-field:#f5f5f5;
  --border:#e0e0e0;
  --text:#333;
  --text-soft:#666;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;}
body{
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  background:linear-gradient(135deg,var(--green-deep) 0%,var(--green-mid) 100%);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:16px;
}
.container{
  width:100%;
  max-width:480px;
  background:#fff;
  border-radius:20px;
  box-shadow:0 10px 50px rgba(0,0,0,.3);
  overflow:hidden;
  min-height:min(720px, calc(100vh - 32px));
  display:flex;
  flex-direction:column;
}

.header{
  background:linear-gradient(135deg,var(--green-deep) 0%,var(--green-mid) 100%);
  padding:16px 14px 12px;
  color:#fff;
  flex-shrink:0;
}
.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.header-btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  background:none;
  border:none;
  cursor:pointer;
  padding:0;
  min-width:56px;
  transition:transform .15s;
  text-decoration:none;
  color:#fff;
}
.header-btn:hover{transform:scale(1.05);}
.header-btn.emergencia .icon{
  width:42px;height:42px;
  background:var(--danger);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
  box-shadow:0 4px 12px rgba(196,30,58,.35);
}
.header-btn.inicio .icon{
  width:42px;height:42px;
  background:rgba(255,255,255,.15);
  border:2px solid rgba(255,255,255,.3);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;
}
.header-btn label{
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.3px;
  color:#fff;
}
.header-center{text-align:center;flex:1;min-width:0;}
.logo-section{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:4px;
}
.logo-icon{height:42px;width:auto;max-width:180px;display:block;flex-shrink:0;object-fit:contain;}
.app-title{font-size:22px;font-weight:bold;letter-spacing:.5px;}
.datetime{font-size:12px;color:rgba(255,255,255,.9);}

.main-content{
  flex:1;
  overflow-y:auto;
  padding:20px 18px 28px;
  -webkit-overflow-scrolling:touch;
}
.page-title{
  font-size:18px;
  color:var(--green-deep);
  font-weight:700;
  margin-bottom:16px;
  text-transform:uppercase;
  letter-spacing:.4px;
  text-align:center;
  line-height:1.25;
}

.cal-wrap{
  background:var(--bg-field);
  border:2px solid var(--border);
  border-radius:16px;
  padding:12px 10px 14px;
  margin-bottom:20px;
}
.cal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  padding:0 4px;
}
.cal-head h2{
  margin:0;
  font-size:16px;
  color:var(--green-deep);
  font-weight:800;
  letter-spacing:.4px;
  text-transform:uppercase;
}
.cal-nav{
  width:36px;height:36px;
  border:none;
  border-radius:50%;
  cursor:pointer;
  background:var(--green-mid);
  color:#fff;
  font-size:16px;
  font-weight:800;
}
.weekdays,.days{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}
.weekdays span{
  text-align:center;
  font-size:11px;
  font-weight:800;
  color:var(--text-soft);
  padding:6px 0;
  text-transform:uppercase;
}
.day{
  position:relative;
  aspect-ratio:1;
  border:none;
  background:transparent;
  border-radius:50%;
  cursor:pointer;
  font-weight:700;
  font-size:14px;
  color:var(--green-deep);
  font-family:inherit;
}
.day.muted{color:#bbb;font-weight:500;}
.day.today{
  background:var(--green-mid);
  color:#fff;
}
.day.selected:not(.today){
  outline:2px solid var(--green-mid);
  outline-offset:-2px;
}
.day.has-event::after{
  content:'';
  position:absolute;
  bottom:4px;left:50%;
  transform:translateX(-50%);
  width:5px;height:5px;
  border-radius:50%;
  background:var(--green-mid);
}
.day.today.has-event::after{background:#fff;}

.section-title{
  font-size:15px;
  color:var(--green-deep);
  font-weight:800;
  text-align:center;
  text-transform:uppercase;
  letter-spacing:.3px;
  margin:0 0 12px;
}

.event-list{display:flex;flex-direction:column;gap:10px;margin-bottom:18px;}
.event-card{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--bg-field);
  border:2px solid var(--border);
  border-radius:16px;
  padding:12px;
}
.event-icon{
  width:42px;height:42px;
  border-radius:50%;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--green-soft);
  font-size:20px;
}
.event-body{flex:1;min-width:0;}
.event-title{margin:0;font-weight:700;color:var(--green-deep);font-size:14px;}
.event-meta{margin:3px 0 0;font-size:12px;color:var(--text-soft);}
.event-actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0;}
.btn-sm{
  border:none;
  border-radius:50px;
  padding:6px 12px;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  cursor:pointer;
  font-family:inherit;
}
.btn-sm.outline{
  background:#fff;
  color:var(--green-mid);
  border:2px solid var(--green-mid);
}
.btn-sm.danger{
  background:#fff;
  color:var(--danger);
  border:2px solid var(--danger);
}

.empty{
  text-align:center;
  color:var(--text-soft);
  font-size:14px;
  padding:18px 10px;
  background:var(--bg-field);
  border-radius:14px;
}

.btn-block{
  display:block;
  width:100%;
  border:none;
  border-radius:50px;
  padding:14px 16px;
  font-weight:700;
  font-size:14px;
  text-transform:uppercase;
  cursor:pointer;
  font-family:inherit;
  background:var(--green-mid);
  color:#fff;
}
.btn-block:hover{background:var(--green-deep);}

.form-group{margin-bottom:12px;}
.field-label{
  font-size:11px;
  color:var(--green-deep);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.4px;
  margin-bottom:6px;
  display:block;
}
.form-field{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--bg-field);
  padding:12px 14px;
  border-radius:12px;
  border:2px solid var(--border);
}
.form-field:focus-within{border-color:var(--green-mid);background:#f9fdf9;}
.form-field input,.form-field select,.form-field textarea{
  flex:1;
  border:none;
  background:transparent;
  font-size:15px;
  font-family:inherit;
  color:var(--text);
  outline:none;
  min-width:0;
}
.form-field textarea{resize:vertical;min-height:64px;}
.datetime-inputs{display:flex;gap:8px;}
.datetime-inputs .form-group{flex:1;}

.popup-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.5);
  z-index:120;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.popup-overlay.show{display:flex;}
.popup-card{
  background:#fff;
  border-radius:18px;
  padding:22px 18px 18px;
  max-width:380px;
  width:100%;
  text-align:center;
  box-shadow:0 12px 40px rgba(0,0,0,.25);
}
.popup-card h2{
  margin:0 0 10px;
  font-size:16px;
  color:var(--green-deep);
  font-weight:700;
  text-transform:uppercase;
}
.popup-card p{
  margin:0 0 16px;
  font-size:14px;
  color:var(--text);
  line-height:1.45;
}
.popup-actions{display:flex;flex-direction:column;gap:8px;}
.popup-card .form-group{text-align:left;}
.hint{font-size:12px;color:var(--text-soft);margin:0 0 12px;text-align:center;}

.toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--green-deep);
  color:#fff;
  padding:12px 18px;
  border-radius:50px;
  font-weight:700;
  font-size:13px;
  opacity:0;
  transition:all .3s;
  z-index:200;
  pointer-events:none;
  max-width:90%;
  text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.25);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (min-width:768px){
  body{align-items:center;padding:28px 24px;}
  .container{max-width:980px;min-height:auto;border-radius:24px;}
  .header{padding:20px 28px 16px;}
  .app-title{font-size:26px;}
  .logo-icon{height:50px;width:auto;max-width:220px;}
  .main-content{padding:28px 36px 36px;}
  .page-title{font-size:22px;}
  .day{font-size:16px;}
  .event-list{display:grid;grid-template-columns:1fr;gap:12px;}
}
@media (min-width:1100px){
  body{padding:36px 40px;}
  .container{max-width:1180px;}
  .main-content{padding:28px 40px 36px;}
  .desktop-grid{
    display:grid;
    grid-template-columns:1.15fr 0.85fr;
    gap:28px;
    align-items:start;
    margin-bottom:22px;
  }
  .cal-wrap{margin-bottom:0;padding:18px 16px 20px;}
  .cal-head h2{font-size:20px;}
  .weekdays span{font-size:12px;padding:8px 0;}
  .day{font-size:17px;}
  .events-col .event-list{grid-template-columns:1fr;max-height:520px;overflow-y:auto;}
  .btn-block{max-width:420px;margin:0 auto;}
}
@media (max-width:480px){
  body{padding:0;}
  .container{max-width:100%;border-radius:0;min-height:100vh;box-shadow:none;}
  .header{padding:14px 12px 12px;}
  .app-title{font-size:20px;}
  .logo-icon{height:36px;width:auto;max-width:150px;}
  .header-btn .icon{width:38px!important;height:38px!important;font-size:20px!important;}
  .main-content{padding:16px 14px 24px;}
}
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <div class="header-top">
      <button type="button" class="header-btn emergencia" onclick="mostrarToast('Chamado de Emergência (em breve)')" aria-label="Emergência">
        <div class="icon">🔔</div>
        <label>Emergência</label>
      </button>
      <div class="header-center">
        <div class="logo-section">
          <img class="logo-icon" src="img/logo.png" alt="TechSaúde">
          
        </div>
        <div class="datetime" id="datetime"></div>
      </div>
      <button type="button" class="header-btn inicio" onclick="mostrarToast('Tela Home (em breve)')" aria-label="Início">
        <div class="icon">🏠</div>
        <label>Início</label>
      </button>
    </div>
  </header>

  <div class="main-content">
    <h1 class="page-title">Calendário de Saúde</h1>

    <div class="desktop-grid">
    <section class="cal-wrap" aria-label="Calendário mensal">
      <div class="cal-head">
        <button type="button" class="cal-nav" onclick="mudarMes(-1)" aria-label="Mês anterior">◄</button>
        <h2 id="cal-titulo">MARÇO 2026</h2>
        <button type="button" class="cal-nav" onclick="mudarMes(1)" aria-label="Próximo mês">►</button>
      </div>
      <div class="weekdays">
        <span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span><span>Dom</span>
      </div>
      <div class="days" id="cal-dias"></div>
    </section>

    <div class="events-col">
    <h2 class="section-title">Próximos Eventos</h2>
    <div class="event-list" id="lista-eventos"></div>
    </div>
    </div>

    <button type="button" class="btn-block" onclick="abrirForm()">+ Incluir novo evento</button>
  </div>
</div>

<div class="popup-overlay" id="popup-form">
  <div class="popup-card" style="text-align:left;max-width:420px;">
    <h2 id="form-titulo" style="text-align:center;">Incluir novo evento</h2>
    <form id="form-evento" onsubmit="salvarEvento(event)">
      <input type="hidden" id="ev-id">
      <div class="form-group">
        <label class="field-label">Tipo de evento</label>
        <div class="form-field">
          <select id="ev-tipo">
            <option value="consulta">Consulta médica</option>
            <option value="medicamento">Medicamento</option>
            <option value="aniversario">Aniversário / compromisso</option>
            <option value="outro">Outro</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="field-label">Descrição</label>
        <div class="form-field">
          <input id="ev-titulo" type="text" placeholder="Ex: Consulta com Dr. Silva" required>
        </div>
      </div>
      <div class="datetime-inputs">
        <div class="form-group">
          <label class="field-label">Data</label>
          <div class="form-field">
            <input id="ev-data" type="date" required>
          </div>
        </div>
        <div class="form-group">
          <label class="field-label">Hora</label>
          <div class="form-field">
            <input id="ev-hora" type="time">
          </div>
        </div>
      </div>
      <div class="form-group">
        <label class="field-label">Observações (opcional)</label>
        <div class="form-field">
          <textarea id="ev-obs" placeholder="Local, dosagem, observações..."></textarea>
        </div>
      </div>
      <p class="hint">Scanner de receita e persistência no banco ficam para a próxima sprint.</p>
      <div class="popup-actions">
        <button type="submit" class="btn-block">Salvar</button>
        <button type="button" class="btn-sm outline" style="padding:12px;" onclick="fecharForm()">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<div class="popup-overlay" id="popup-excluir">
  <div class="popup-card">
    <h2>Excluir evento?</h2>
    <p id="excluir-texto"></p>
    <div class="popup-actions">
      <button type="button" class="btn-block" style="background:var(--danger)" onclick="confirmarExclusao()">Sim, excluir</button>
      <button type="button" class="btn-sm outline" style="padding:12px;" onclick="fecharExcluir()">Cancelar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MESES = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
const SEMANA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MESES_LONG = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const KEY = 'techsaude_calendario_v1';
const ICONS = {consulta:'🩺', medicamento:'💊', aniversario:'🎂', outro:'📌'};

let viewYear, viewMonth, selectedISO = null, excluirId = null;

const seed = [
  {id:1, tipo:'consulta', titulo:'Consulta com Dr. Silva', data:'2026-03-02', hora:'', obs:''},
  {id:2, tipo:'medicamento', titulo:'Tomar Remédio (Pílula)', data:'2026-03-02', hora:'18:00', obs:''},
  {id:3, tipo:'aniversario', titulo:'Aniversário da Ana', data:'2026-03-03', hora:'', obs:''},
  {id:4, tipo:'consulta', titulo:'Retorno cardiologia', data:'2026-03-10', hora:'09:30', obs:''},
  {id:5, tipo:'medicamento', titulo:'Tomar Remédio (Pílula)', data:'2026-03-15', hora:'08:00', obs:''}
];

function canUseStorage(){
  try{
    const t='__ts_test__';
    window.localStorage.setItem(t,'1');
    window.localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}
const HAS_STORAGE = canUseStorage();
function loadEventos(){
  if(HAS_STORAGE){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed) && parsed.length) return parsed;
      }
      localStorage.setItem(KEY, JSON.stringify(seed));
    }catch(e){}
  }
  return seed.slice();
}
let eventos = loadEventos();
function saveEventos(){
  if(!HAS_STORAGE) return;
  try{ localStorage.setItem(KEY, JSON.stringify(eventos)); }catch(e){}
}

function pad(n){ return String(n).padStart(2,'0'); }
function toISO(y,m,d){ return y + '-' + pad(m+1) + '-' + pad(d); }
function fmtDataBR(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return d + '/' + m + '/' + y;
}

function atualizarRelogio(){
  const now = new Date();
  document.getElementById('datetime').textContent =
    pad(now.getHours()) + ':' + pad(now.getMinutes()) + ' - ' +
    SEMANA[now.getDay()] + ', ' + now.getDate() + ' de ' + MESES_LONG[now.getMonth()] + ' de ' + now.getFullYear();
}

function renderCalendario(){
  document.getElementById('cal-titulo').textContent = MESES[viewMonth] + ' ' + viewYear;
  const first = new Date(viewYear, viewMonth, 1);
  let start = first.getDay();
  start = start === 0 ? 6 : start - 1;
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const prevDays = new Date(viewYear, viewMonth, 0).getDate();
  const today = new Date();
  const todayISO = toISO(today.getFullYear(), today.getMonth(), today.getDate());
  const eventDays = new Set(eventos.map(e => e.data));

  const grid = document.getElementById('cal-dias');
  grid.innerHTML = '';
  const cells = [];
  for(let i=0;i<start;i++){
    const d = prevDays - start + 1 + i;
    cells.push({d, muted:true, iso: toISO(viewMonth===0?viewYear-1:viewYear, viewMonth===0?11:viewMonth-1, d)});
  }
  for(let d=1;d<=daysInMonth;d++){
    cells.push({d, muted:false, iso: toISO(viewYear, viewMonth, d)});
  }
  while(cells.length % 7 !== 0){
    const extra = cells.length - (start + daysInMonth) + 1;
    cells.push({d: extra, muted:true, iso: toISO(viewMonth===11?viewYear+1:viewYear, viewMonth===11?0:viewMonth+1, extra)});
  }
  cells.forEach(c => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'day';
    btn.textContent = c.d;
    if(c.muted) btn.classList.add('muted');
    if(c.iso === todayISO) btn.classList.add('today');
    if(c.iso === selectedISO) btn.classList.add('selected');
    if(eventDays.has(c.iso)) btn.classList.add('has-event');
    btn.onclick = () => { selectedISO = (selectedISO === c.iso) ? null : c.iso; renderCalendario(); renderEventos(); };
    grid.appendChild(btn);
  });
}

function renderEventos(){
  const el = document.getElementById('lista-eventos');
  let lista = eventos.slice().sort((a,b) => (a.data+(a.hora||'')).localeCompare(b.data+(b.hora||'')));
  if(selectedISO) lista = lista.filter(e => e.data === selectedISO);
  else {
    const prefix = viewYear + '-' + String(viewMonth+1).padStart(2,'0');
    lista = lista.filter(e => e.data.startsWith(prefix)).slice(0, 8);
  }
  if(!lista.length){
    el.innerHTML = '<div class="empty" style="grid-column:1/-1">Nenhum evento neste período.</div>';
    return;
  }
  el.innerHTML = lista.map(e => {
    const hora = e.hora ? ' – ' + e.hora : '';
    return '<article class="event-card">' +
      '<div class="event-icon">' + (ICONS[e.tipo] || '📌') + '</div>' +
      '<div class="event-body">' +
        '<p class="event-title">' + escapeHtml(e.titulo) + '</p>' +
        '<p class="event-meta">' + fmtDataBR(e.data) + hora + '</p>' +
      '</div>' +
      '<div class="event-actions">' +
        '<button type="button" class="btn-sm outline" onclick="editarEvento(' + e.id + ')">Editar</button>' +
        '<button type="button" class="btn-sm danger" onclick="pedirExclusao(' + e.id + ')">Excluir</button>' +
      '</div></article>';
  }).join('');
}

function escapeHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mudarMes(delta){
  viewMonth += delta;
  if(viewMonth < 0){ viewMonth = 11; viewYear--; }
  if(viewMonth > 11){ viewMonth = 0; viewYear++; }
  renderCalendario();
}

function abrirForm(ev){
  document.getElementById('form-titulo').textContent = ev ? 'Editar evento' : 'Incluir novo evento';
  document.getElementById('ev-id').value = ev ? ev.id : '';
  document.getElementById('ev-tipo').value = ev ? ev.tipo : 'consulta';
  document.getElementById('ev-titulo').value = ev ? ev.titulo : '';
  document.getElementById('ev-data').value = ev ? ev.data : (selectedISO || toISO(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()));
  document.getElementById('ev-hora').value = ev && ev.hora ? ev.hora : '';
  document.getElementById('ev-obs').value = ev && ev.obs ? ev.obs : '';
  document.getElementById('popup-form').classList.add('show');
}
function fecharForm(){ document.getElementById('popup-form').classList.remove('show'); }

function salvarEvento(e){
  e.preventDefault();
  const id = document.getElementById('ev-id').value;
  const item = {
    id: id ? Number(id) : Date.now(),
    tipo: document.getElementById('ev-tipo').value,
    titulo: document.getElementById('ev-titulo').value.trim(),
    data: document.getElementById('ev-data').value,
    hora: document.getElementById('ev-hora').value,
    obs: document.getElementById('ev-obs').value.trim()
  };
  if(!item.titulo || !item.data){ mostrarToast('Preencha descrição e data'); return; }
  if(id){
    eventos = eventos.map(x => x.id === item.id ? item : x);
    mostrarToast('Evento atualizado!');
  } else {
    eventos.push(item);
    mostrarToast('Evento incluído!');
  }
  saveEventos();
  fecharForm();
  renderCalendario();
  renderEventos();
}

function editarEvento(id){
  const ev = eventos.find(x => x.id === id);
  if(ev) abrirForm(ev);
}
function pedirExclusao(id){
  const ev = eventos.find(x => x.id === id);
  if(!ev) return;
  excluirId = id;
  document.getElementById('excluir-texto').textContent = ev.titulo + ' — ' + fmtDataBR(ev.data);
  document.getElementById('popup-excluir').classList.add('show');
}
function fecharExcluir(){ document.getElementById('popup-excluir').classList.remove('show'); excluirId = null; }
function confirmarExclusao(){
  eventos = eventos.filter(x => x.id !== excluirId);
  saveEventos();
  fecharExcluir();
  renderCalendario();
  renderEventos();
  mostrarToast('Evento excluído.');
}

function mostrarToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

(function init(){
  viewYear = 2026;
  viewMonth = 2;
  atualizarRelogio();
  setInterval(atualizarRelogio, 30000);
  renderCalendario();
  renderEventos();
})();
</script>
