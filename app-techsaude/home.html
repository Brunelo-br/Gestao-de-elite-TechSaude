<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechSaúde — Home</title>

<!-- SUPABASE JS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --cream: #f3efdc;
    --cream-deep: #ece5c9;
    --ink: #16301f;
    --ink-soft: #2e4a37;
    --green-deep: #1b3a26;
    --green-mid: #2f6b46;
    --teal: #2f9e8f;
    --line: #cdbf95;
    --text: #26332a;
    --text-soft: #55604f;
    --error: #a3402c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: var(--cream);
    font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
    display:flex;
    flex-direction:column;
  }

  /* ============ TELA HOME ============ */
  .home-topbar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    position:relative;
    padding:18px 14px 14px;
    background: linear-gradient(160deg, #1d5b3a, #123a26);
  }
  .home-logo-center{ display:flex; flex-direction:column; align-items:center; gap:4px; padding-top:2px; }
  .home-logo-center .logo-mark{ width:200px; height:200px; object-fit:contain; }
  .wordmark{ font-size:1.1rem; font-weight:800; letter-spacing:-0.5px; }
  .wordmark .tech{ color:#8fe0cf; }
  .wordmark .saude{ color:var(--cream); }

  .topbar-btn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:none; border:none; cursor:pointer; color:var(--cream);
    font-size:0.64rem; font-weight:800; letter-spacing:0.3px; text-transform:uppercase;
    padding:2px; width:60px; font-family:inherit;
  }
  .topbar-btn .icon-circle{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .topbar-btn.emergencia .icon-circle{ background:#c0392b; }
  .topbar-btn.sair .icon-circle{ background:rgba(255,255,255,0.16); }
  .topbar-btn svg{ width:20px; height:20px; }
  .topbar-btn:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }

  .home-datetime{
    padding:9px 18px;
    font-size:0.85rem;
    color:var(--text-soft);
    background:var(--cream);
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
  }

  .home-msg{
    display:none;
    margin:12px 16px 0;
    padding:11px 14px;
    border-radius:14px;
    font-size:0.84rem;
    font-weight:700;
    background:#f4dcd6; color:var(--error); border:1px solid #e0a998;
  }
  .home-msg.show{ display:block; }

  .home-body{ padding:16px 16px 0; }
  .home-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:16px;
  }
  .home-card{
    background:var(--cream-deep);
    border:2px solid var(--line);
    border-radius:20px;
    padding:16px 6px 14px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; text-align:center; font-family:inherit;
    transition: border-color .15s ease, transform .08s ease;
  }
  .home-card:hover{ border-color:var(--teal); }
  .home-card:active{ transform:scale(0.97); }
  .home-card:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }
  .home-card svg{ width:42px; height:42px; color:var(--green-deep); }
  .home-card span{
    font-weight:800; color:var(--green-deep); font-size:0.8rem;
    line-height:1.25; text-transform:uppercase;
  }

  .home-banner{
    background: linear-gradient(160deg, #1d5b3a, #123a26);
    border-radius:22px 22px 0 0;
    padding:22px 18px 28px;
    display:flex; align-items:center; gap:14px;
    flex:1;
  }

  input, select, textarea, button{ font-family:'Trebuchet MS', 'Segoe UI', Verdana, sans-serif; }
  h1, h2{ color:var(--green-deep); font-weight:900; text-transform:uppercase; }
  .home-banner svg{ width:52px; height:52px; flex-shrink:0; }
  .home-banner span{
    color:var(--cream); font-weight:800; font-size:1rem; line-height:1.3;
  }

  /* ============ DESKTOP (>= 900px) ============ */
  @media (min-width: 900px){
    body{
      background: radial-gradient(circle at 50% 0%, #0f5132 0%, #0b3e28 45%, #082a1c 100%);
      align-items:center;
      justify-content:center;
      padding:40px 24px;
    }
    .page, .site, .home-wrap{
      width:100%;
      max-width:1080px;
      min-height:660px;
      border-radius:32px;
      margin:auto;
      overflow:hidden;
      box-shadow: 0 30px 70px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06);
      display:flex;
      flex-direction:column;
    }
    .home-topbar{ padding:26px 32px 18px; }
    .home-datetime{ padding:10px 32px; }
    .home-body{ padding:22px 32px 0; }
    .home-grid{ grid-template-columns:1fr 1fr 1fr; gap:16px; }
    .home-card{ padding:22px 10px 18px; }
    .home-card svg{ width:48px; height:48px; }
    .home-card span{ font-size:0.85rem; }
    .home-banner{ padding:26px 32px 32px; border-radius:0; }
  }
</style>
<!-- ===== PADRÃO TECHSAÚDE: ACESSIBILIDADE (tamanho da letra + Ajuda) ===== -->
<script>
  /* Aplica o tamanho de letra salvo ANTES da tela aparecer (evita "piscar") */
  (function(){
    try{
      var f = parseFloat(localStorage.getItem('techsaude_fonte'));
      if(f >= 85 && f <= 150){ document.documentElement.style.fontSize = f + '%'; }
    }catch(e){}
  })();
</script>
<style>
  /* Barra de acessibilidade (mesmo visual da tela Mini Jogos) */
  .toolbar-acessibilidade{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; margin:0 0 22px; }
  .toolbar-acessibilidade .font-group{ display:inline-flex; border:2px solid #cdbf95; border-radius:999px; overflow:hidden; background:#fff; }
  .toolbar-acessibilidade .font-btn{
    border:none; background:#fff; color:#1b3a26; font-weight:800; padding:9px 13px; cursor:pointer;
    font-size:.75rem; font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif; min-width:44px; min-height:40px; margin:0;
  }
  .toolbar-acessibilidade .font-btn + .font-btn{ border-left:1px solid #e4dbbd; }
  .toolbar-acessibilidade .font-btn.active{ background:#1b3a26; color:#f3efdc; }

  .toolbar-acessibilidade .chip-btn:focus-visible{ outline:3px solid #2f9e8f; outline-offset:2px; }
  .toolbar-acessibilidade .chip-btn{
    background:#fff; border:2px solid #cdbf95; border-radius:999px; padding:9px 15px; font-size:.75rem; min-height:40px; margin:0;
    font-weight:700; text-transform:uppercase; letter-spacing:.3px; color:#1b3a26; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
  }
  .toolbar-acessibilidade .chip-btn:hover{ border-color:#2f9e8f; }

  /* Pop-up de Ajuda */
  .ajuda-overlay{ position:fixed; inset:0; background:rgba(10,20,14,0.55); display:flex; align-items:center; justify-content:center; padding:1rem; z-index:10000; }
  .ajuda-overlay[hidden]{ display:none !important; }
  .ajuda-modal{
    background:#f3efdc; border:2px solid #cdbf95; border-radius:22px; padding:2rem 1.6rem 1.5rem; max-width:460px; width:100%;
    position:relative; box-shadow:0 30px 60px rgba(0,0,0,0.35); max-height:90vh; overflow-y:auto; text-align:left;
    font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif; color:#26332a; animation:ajudaPop .2s ease;
  }
  @keyframes ajudaPop{ from{ transform:scale(.94); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .ajuda-modal .ajuda-fechar{
    position:absolute; top:.75rem; right:.75rem; background:#ece5c9; border:none; width:2.6rem; height:2.6rem;
    border-radius:50%; font-size:1.1rem; cursor:pointer; color:#1b3a26; margin:0; padding:0;
  }
  .ajuda-modal .ajuda-tag{ margin:0 0 .3rem; font-size:.75rem; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:#2f6b46; }
  .ajuda-modal h2{ margin:0 2.6rem .5rem 0; padding:0; font-size:1.3rem; line-height:1.2; color:#1b3a26; font-weight:900; text-transform:uppercase; text-align:left; font-family:inherit; }
  .ajuda-modal .ajuda-intro{ margin:0 0 1rem; font-size:.98rem; font-weight:600; color:#55604f; line-height:1.45; }
  .ajuda-modal .ajuda-lista{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.7rem; counter-reset:passo; }
  .ajuda-modal .ajuda-lista li{
    counter-increment:passo; position:relative; padding:0 0 0 2.5rem; margin:0; min-height:1.9rem;
    font-size:1rem; font-weight:600; line-height:1.45; color:#26332a;
  }
  .ajuda-modal .ajuda-lista li::before{
    content:counter(passo); position:absolute; left:0; top:-.05rem; width:1.9rem; height:1.9rem; border-radius:50%;
    background:#1b3a26; color:#f3efdc; font-weight:800; font-size:.95rem; display:flex; align-items:center; justify-content:center;
  }
  .ajuda-modal .ajuda-lista b{ color:#1b3a26; }
  .ajuda-modal .ajuda-extra{ margin:1.1rem 0 0; padding:.8rem 1rem; background:#dcefdf; border:1.5px solid #a5d6a7; border-radius:14px; font-size:.95rem; font-weight:600; color:#1b4332; line-height:1.4; }
  .ajuda-modal .ajuda-ok{
    display:block; width:100%; margin:1.2rem 0 0; padding:.9rem; border:none; border-radius:999px; cursor:pointer;
    background:linear-gradient(180deg,#234a34,#1b3a26); color:#f3efdc; font-weight:800; font-size:1rem; text-transform:uppercase;
    letter-spacing:.4px; font-family:inherit; box-shadow:0 5px 0 #0e2416;
  }
  .ajuda-modal .ajuda-ok:active{ transform:translateY(3px); box-shadow:0 2px 0 #0e2416; }
  .ajuda-modal button:focus-visible{ outline:3px solid #2f9e8f; outline-offset:2px; }
</style>

<script>
  // ---------- 1. CONFIGURAÇÃO SUPABASE ----------
  const SUPABASE_URL = 'https://mbqcazpulgywultkrbvq.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_gPi7EG8MoRlUbvIjNmG0zA_wRkEfzuq';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---------- 2. CONTROLE DE SESSÃO ----------
  let usuario = null;

  try {
    const usuarioSalvo = localStorage.getItem('usuario_logado') || localStorage.getItem('usuarioLogado');
    console.log('Conteúdo de localStorage.getItem(\'usuario_logado\'):', localStorage.getItem('usuario_logado'));

    if (!usuarioSalvo) {
      window.location.href = 'index.html';
    } else {
      usuario = JSON.parse(usuarioSalvo);
      const primeiroNome = usuario.nome_completo ? usuario.nome_completo.split(' ')[0] : 'Usuário';
      document.getElementById('user-greeting').textContent = `Olá, ${primeiroNome}!`;
    }
  } catch (error) {
    console.error('Erro ao ler os dados do usuário no localStorage:', error);
  }

  // ---------- 3. RELÓGIO ----------
  const dias = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  function updateClock(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const texto = `${hh}:${mm} - ${dias[now.getDay()]}, ${now.getDate()} de ${meses[now.getMonth()]} de ${now.getFullYear()}`;
    document.querySelectorAll('.clock-text').forEach(el => el.textContent = texto);
  }
  updateClock();
  setInterval(updateClock, 1000 * 30);

  // ---------- 4. ATALHOS ----------
  const FEATURES = {
    medicamento: { title: 'Alarme de Medicamento', url: 'medicamentos.html' },
    calendario:  { title: 'Calendário de Saúde', url: 'calendario-saude.html' },
    voz:         { title: 'Comando de Voz' },
    dicas:       { title: 'Dicas Úteis', url: 'dicas-uteis.html' },
    jogos:       { title: 'Mini Jogos de Memória', url: 'minijogos.html' },
    consultas:   { title: 'Lembrete de Consultas', url: 'lembretedeconsultas.html' },
    configuracoes: { title: 'Configurações', url: 'configuracoes.html' },
    hospitais:   { title: 'Hospitais e Unidades de Saúde', url: 'hospitais.html' },
  };

  function openFeature(key){
    if (key === 'voz') { window.AssistenteVoz.abrir(); return; }
    const f = FEATURES[key];
    if(!f) return;
    if(f.url){
      window.location.href = f.url;
      return;
    }
    alert(`Abrindo ${f.title}... (Em desenvolvimento)`);
  }

  // ---------- 6. LOGOUT ----------
  function logout(){
    localStorage.removeItem('usuario_logado');
    window.location.href = 'index.html';
  }
</script>
   <script src="assistente-voz.js"></script>
<!-- ===== PADRÃO TECHSAÚDE: pop-up de Ajuda (o conteúdo vem de AJUDA_TELA, no script abaixo) ===== -->
<div id="modalAjuda" class="ajuda-overlay" hidden>
  <div class="ajuda-modal" role="dialog" aria-modal="true" aria-labelledby="ajudaTitulo">
    <button type="button" class="ajuda-fechar" id="fecharAjuda" aria-label="Fechar ajuda">✕</button>
    <p class="ajuda-tag">❔ Ajuda</p>
    <h2 id="ajudaTitulo">Como usar esta tela</h2>
    <p class="ajuda-intro" id="ajudaIntro"></p>
    <ol class="ajuda-lista" id="ajudaLista"></ol>
    <p class="ajuda-extra" id="ajudaExtra"></p>
    <button type="button" class="ajuda-ok" id="ajudaOk">Entendi</button>
  </div>
</div>

<script>
/* ===== PADRÃO TECHSAÚDE: tamanho da letra + Ajuda =====
   Para mudar o texto da Ajuda desta tela, edite apenas AJUDA_TELA.
   - "quando": seletor CSS que indica em qual parte da tela o usuário está
     (o primeiro item que existir na tela é o usado; o último, sem "quando", é o padrão).
   - "passos": lista curta, em ordem, do que fazer.                                  */
(function(){
  "use strict";

  var AJUDA_TELA = [
    {
      titulo: 'Como usar a tela inicial',
      intro: 'Esta é a tela principal do TechSaúde. Daqui você chega em todas as funções do aplicativo.',
      passos: [
        'Toque em um dos <b>quadrados</b> para abrir a função que você quer usar.',
        '<b>Alarme de Medicamento</b>: cadastre seus remédios e receba um aviso na hora de tomar.',
        '<b>Lembrete de Consultas</b>: anote suas consultas médicas para não esquecer.',
        '<b>Hospitais e Unidades de Saúde</b>: consulte a função para encontrar serviços de saúde.',
        '<b>Mini Jogos de Memória</b>: jogos simples para exercitar a mente.',
        '<b>Comando de Voz</b>: fale o que precisa, por exemplo “próximo remédio”.',
        'Em caso de urgência, toque no botão vermelho <b>Emergência</b>, no alto à esquerda. Para sair da conta, toque em <b>Sair</b>, no alto à direita.'
      ],
      dica: 'Em todas as telas existe o botão ❔ Ajuda. Toque nele sempre que tiver dúvida. 💚'
    }
  ];

  // Passo comum a todas as telas (acessibilidade)
  var PASSO_LETRA = 'Letra pequena? Toque em <b>A+</b> ou <b>A++</b>, logo acima, para aumentar. Sua escolha fica salva para todas as telas.';

  // ---------- TAMANHO DA LETRA (salvo para todas as telas) ----------
  var CHAVE_FONTE = 'techsaude_fonte';
  var botoesFonte = document.querySelectorAll('.toolbar-acessibilidade .font-btn');

  function escalaAtual(){ return parseFloat(document.documentElement.style.fontSize) || 100; }

  function marcarBotaoFonte(){
    var atual = escalaAtual();
    botoesFonte.forEach(function(b){
      var ativo = Number(b.dataset.scale) === atual;
      b.classList.toggle('active', ativo);
      b.setAttribute('aria-pressed', ativo ? 'true' : 'false');
    });
  }

  function aplicarFonte(escala, salvar){
    document.documentElement.style.fontSize = escala + '%';
    if(salvar){ try{ localStorage.setItem(CHAVE_FONTE, String(escala)); }catch(e){} }
    marcarBotaoFonte();
  }

  botoesFonte.forEach(function(btn){
    btn.addEventListener('click', function(){ aplicarFonte(Number(btn.dataset.scale), true); });
  });
  // Comando de voz ("aumentar letra") e outras abas também atualizam os botões
  window.addEventListener('techsaude:fonte', marcarBotaoFonte);
  window.addEventListener('storage', function(e){
    if(e.key === CHAVE_FONTE && e.newValue){ aplicarFonte(parseFloat(e.newValue) || 100, false); }
  });
  marcarBotaoFonte();

  // ---------- AJUDA ----------
  var modal = document.getElementById('modalAjuda');
  var focoAnterior = null;

  function conteudoAtual(){
    for(var i = 0; i < AJUDA_TELA.length; i++){
      var item = AJUDA_TELA[i];
      if(!item.quando || document.querySelector(item.quando)) return item;
    }
    return AJUDA_TELA[AJUDA_TELA.length - 1];
  }

  function abrirAjuda(){
    var c = conteudoAtual();
    document.getElementById('ajudaTitulo').textContent = c.titulo;
    var intro = document.getElementById('ajudaIntro');
    intro.innerHTML = c.intro || '';
    intro.hidden = !c.intro;
    document.getElementById('ajudaLista').innerHTML = c.passos.concat([PASSO_LETRA]).map(function(p){ return '<li>' + p + '</li>'; }).join('');
    var extra = document.getElementById('ajudaExtra');
    extra.innerHTML = c.dica || '';
    extra.hidden = !c.dica;
    focoAnterior = document.activeElement;
    modal.hidden = false;
    document.getElementById('ajudaOk').focus({ preventScroll: true });
    modal.querySelector('.ajuda-modal').scrollTop = 0;
  }

  function fecharAjuda(){
    modal.hidden = true;
    if(focoAnterior && focoAnterior.focus){ focoAnterior.focus(); }
  }

  document.getElementById('btnAjuda').addEventListener('click', abrirAjuda);
  document.getElementById('fecharAjuda').addEventListener('click', fecharAjuda);
  document.getElementById('ajudaOk').addEventListener('click', fecharAjuda);
  modal.addEventListener('click', function(e){ if(e.target === modal) fecharAjuda(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !modal.hidden) fecharAjuda(); });
})();
</script>
<!-- ===== FIM DO PADRÃO TECHSAÚDE ===== -->
</body>
</html>
