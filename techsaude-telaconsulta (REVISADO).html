<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSaúde - Incluir Consulta em Agenda</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e5631 0%, #2d7a3e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #1e5631 0%, #2d7a3e 100%);
            padding: 20px;
            color: white;
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header-buttons {
            display: flex;
            gap: 40px;
        }

        .header-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: none;
            border: none;
            padding: 0;
        }

        .header-btn:hover {
            transform: scale(1.05);
        }

        .header-btn:hover .icon {
            transform: scale(1.15);
        }

        .header-btn.emergencia .icon {
            width: 45px;
            height: 45px;
            background: #c41e3a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 4px 15px rgba(196, 30, 58, 0.3);
            transition: transform 0.3s ease;
        }

        .header-btn.emergencia:hover .icon {
            box-shadow: 0 6px 20px rgba(196, 30, 58, 0.5);
        }

        .header-btn.inicio .icon {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            transition: all 0.3s ease;
        }

        .header-btn.inicio:hover .icon {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .header-btn label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .header-center {
            text-align: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .logo-icon {
            width: 55px;
            height: auto;
            display: block;
            flex-shrink: 0;
        }

        .app-title {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .datetime {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 5px;
        }

        /* MAIN CONTENT */
        .main-content {
            padding: 30px;
        }

        .page-title {
            font-size: 24px;
            color: #1e5631;
            font-weight: 700;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-layout {
            display: grid;
            gap: 20px;
        }

        /* Seção 1: Campos básicos (2 colunas no desktop) */
        .section-1 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
        }

        /* Campo do formulário */
        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-field {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f5f5f5;
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s ease;
        }

        .form-field:focus-within {
            border-color: #2d7a3e;
            background: #f9fdf9;
            box-shadow: 0 0 8px rgba(45, 122, 62, 0.1);
        }

        .form-field.focused {
            border-color: #2d7a3e;
            background: #f9fdf9;
        }

        .form-field input,
        .form-field textarea {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            font-family: inherit;
            color: #333;
            outline: none;
        }

        .form-field input::placeholder,
        .form-field textarea::placeholder {
            color: #999;
        }

        .field-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            color: #2d7a3e;
        }

        .field-label {
            font-size: 12px;
            color: #1e5631;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: block;
        }

        /* Seção de Data e Hora (layout especial) */
        .datetime-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .datetime-group {
            display: flex;
            flex-direction: column;
        }

        .datetime-inputs {
            display: flex;
            gap: 10px;
        }

        .datetime-inputs .form-field {
            flex: 1;
        }

        /* Alarme e Notificações */
        .alarm-section {
            background: #f5f5f5;
            padding: 16px;
            border-radius: 12px;
            border: 2px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .alarm-section:hover {
            border-color: #2d7a3e;
            background: #f9fdf9;
        }

        .alarm-label {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .alarm-label .field-icon {
            margin-bottom: 0;
        }

        .alarm-text {
            display: flex;
            flex-direction: column;
        }

        .alarm-title {
            font-size: 12px;
            color: #1e5631;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .alarm-subtitle {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        /* Toggle Switch */
        .toggle-switch {
            position: relative;
            width: 60px;
            height: 32px;
            background: #ddd;
            border-radius: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
            border: none;
            outline: none;
        }

        .toggle-switch.active {
            background: #4caf50;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 28px;
            height: 28px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s ease;
        }

        .toggle-switch.active::after {
            left: 30px;
        }

        .toggle-label {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
            text-align: center;
            font-weight: 600;
        }

        /* Seção de Observações */
        .observations-section {
            display: flex;
            flex-direction: column;
        }

        .form-field.textarea-field {
            align-items: flex-start;
            padding-top: 12px;
        }

        .form-field textarea {
            resize: vertical;
            min-height: 80px;
            padding-top: 4px;
        }

        /* Seção de Botões */
        .buttons-section {
            display: grid;
            gap: 16px;
            margin-top: 30px;
        }

        .primary-button-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-save {
            flex: 1;
            background: #2d7a3e;
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-save:hover {
            background: #1e5631;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(45, 122, 62, 0.3);
        }

        .btn-save:active {
            transform: translateY(0);
        }

        .btn-clear {
            background: #f5f5f5;
            color: #c41e3a;
            border: 2px solid #c41e3a;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-clear:hover {
            background: #c41e3a;
            color: white;
        }

        .secondary-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #1e5631;
            border: 2px solid #ddd;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
            border-color: #2d7a3e;
            color: #2d7a3e;
        }

        /* Responsividade Mobile */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                border-radius: 16px;
            }

            .header {
                padding: 16px;
            }

            .header-top {
                margin-bottom: 12px;
            }

            .header-buttons {
                gap: 30px;
            }

            .header-btn .icon {
                width: 40px !important;
                height: 40px !important;
                font-size: 22px !important;
            }

            .header-btn label {
                font-size: 11px;
            }

            .logo-icon {
                width: 40px;
                height: auto;
                display: block;
            }

            .app-title {
                font-size: 24px;
            }

            .datetime {
                font-size: 12px;
            }

            .main-content {
                padding: 20px;
            }

            .page-title {
                font-size: 18px;
                margin-bottom: 20px;
            }

            .section-1 {
                grid-template-columns: 1fr;
            }

            .datetime-inputs {
                flex-direction: column;
            }

            .primary-button-group {
                flex-direction: column;
            }

            .btn-save {
                width: 100%;
            }

            .btn-clear {
                width: 100%;
            }

            .secondary-buttons {
                grid-template-columns: 1fr;
            }
        }

        /* Responsividade Tablet */
        @media (min-width: 769px) and (max-width: 1024px) {
            .main-content {
                padding: 25px;
            }

            .section-1 {
                grid-template-columns: repeat(2, 1fr);
            }

            .datetime-section {
                grid-template-columns: 1fr;
            }

            .datetime-inputs {
                gap: 12px;
            }
        }

        /* Desktop grande */
        @media (min-width: 1025px) {
            .main-content {
                padding: 40px;
            }

            .section-1 {
                grid-template-columns: repeat(2, 1fr);
            }

            .datetime-section {
                grid-template-columns: repeat(2, 1fr);
            }

            .datetime-inputs {
                gap: 15px;
            }

            .secondary-buttons {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Estados de validação */
        .form-field.error {
            border-color: #c41e3a;
            background: rgba(196, 30, 58, 0.05);
        }

        .form-field.success {
            border-color: #4caf50;
            background: rgba(76, 175, 80, 0.05);
        }

        .error-message {
            font-size: 12px;
            color: #c41e3a;
            margin-top: 4px;
            display: none;
        }

        .form-field.error ~ .error-message {
            display: block;
        }

        /* Animações */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            animation: slideIn 0.3s ease-out;
        }
    </style>
</head>

                    </div>
                    <div class="datetime" id="datetime"></div>
                </div>
                <div class="header-buttons">
                    <button class="header-btn inicio" onclick="irParaInicio()">
                        <div class="icon">🏠</div>
                        <label>INÍCIO</label>
                    </button>
                </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <h1 class="page-title">Incluir Consulta em Agenda</h1>

            <div class="form-layout">
                <!-- Seção 1: Campos Principais -->
                <div class="section-1">
                    <!-- LOCAL -->
                    <div class="form-group">
                        <label class="field-label">LOCAL (Clínica/Hospital)</label>
                        <div class="form-field" onclick="this.classList.add('focused')" onblur="this.classList.remove('focused')">
                            <div class="field-icon">🏥</div>
                            <input type="text" id="local" placeholder="Ex: Hospital de Olhos" required>
                        </div>
                        <div class="error-message">Campo obrigatório</div>
                    </div>

                    <!-- ESPECIALIDADE -->
                    <div class="form-group">
                        <label class="field-label">Especialidade</label>
                        <div class="form-field" onclick="this.classList.add('focused')" onblur="this.classList.remove('focused')">
                            <div class="field-icon">🩺</div>
                            <input type="text" id="especialidade" placeholder="Ex: Oftalmologia" required>
                        </div>
                        <div class="error-message">Campo obrigatório</div>
                    </div>

                    <!-- MÉDICO -->
                    <div class="form-group">
                        <label class="field-label">Médico</label>
                        <div class="form-field" onclick="this.classList.add('focused')" onblur="this.classList.remove('focused')">
                            <div class="field-icon">👨‍⚕️</div>
                            <input type="text" id="medico" placeholder="Ex: Dra. Ana Silva" required>
                        </div>
                        <div class="error-message">Campo obrigatório</div>
                    </div>

                    <!-- DIA E HORA -->
                    <div class="form-group">
                        <label class="field-label">Dia e Hora</label>
                        <div class="datetime-inputs">
                            <div class="form-field" onclick="this.classList.add('focused')" onblur="this.classList.remove('focused')">
                                <div class="field-icon">📅</div>
                                <input type="date" id="data" required>
                            </div>
                            <div class="form-field" onclick="this.classList.add('focused')" onblur="this.classList.remove('focused')">
                                <div class="field-icon">🕐</div>
                                <input type="time" id="hora" placeholder="HH:MM" required>
                            </div>
                        </div>
                        <div class="error-message">Data e hora obrigatórias</div>
                    </div>
                </div>

                <!-- ALARME E NOTIFICAÇÕES -->
                <div class="form-group">
                    <label class="field-label" style="margin-bottom: 12px;">Alarme e Notificações</label>
                    <div class="alarm-section">
                        <div class="alarm-label">
                            <div class="field-icon">🔔</div>
                            <div class="alarm-text">
                                <div class="alarm-title">Alarme e Notificações</div>
                                <div class="alarm-subtitle">(Criação Automática)</div>
                            </div>
                        </div>
                        <button class="toggle-switch active" id="alarmToggle" onclick="toggleAlarm(this)"></button>
                    </div>
                    <div class="toggle-label">ATIVO</div>
                </div>

                <!-- OBSERVAÇÕES -->
                <div class="form-group">
                    <label class="field-label">Observações (Opcional)</label>
                    <div class="form-field textarea-field" onclick="this.classList.add('focused')" onblur="this.classList.remove('focused')">
                        <div class="field-icon">✏️</div>
                        <textarea id="observacoes" placeholder="Ex: Jejum de 8h necessário, levar exames anteriores"></textarea>
                    </div>
                </div>

                <!-- BOTÕES DE AÇÃO -->
                <div class="buttons-section">
                    <div class="primary-button-group">
                        <button class="btn-save" onclick="salvarConsulta()">
                            <span>➕</span> SALVAR NA AGENDA
                        </button>
                        <button class="btn-clear" onclick="limparFormulario()">
                            <span>🗑️</span> LIMPAR
                        </button>
                    </div>

                    <div class="secondary-buttons">
                        <button class="btn-secondary" onclick="digitarConsulta()">
                            <span>⌨️</span> DIGITAR CONSULTA
                        </button>
                        <button class="btn-secondary" onclick="escanearEncaminhamento()">
                            <span>📷</span> ESCANEAR ENCAMINHAMENTO
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Atualizar data e hora do cabeçalho
        function atualizarDataHora() {
            const agora = new Date();
            const diasSemana = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
            const meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
            
            const hora = String(agora.getHours()).padStart(2, '0');
            const minuto = String(agora.getMinutes()).padStart(2, '0');
            const dia = agora.getDate();
            const diaSemana = diasSemana[agora.getDay()];
            const mes = meses[agora.getMonth()];
            const ano = agora.getFullYear();
            
            const formatado = `${hora}:${minuto} - ${diaSemana}, ${dia} de ${mes} de ${ano}`;
            document.getElementById('datetime').textContent = formatado;
        }

        atualizarDataHora();
        setInterval(atualizarDataHora, 60000); // Atualizar a cada minuto

        // Validar campos obrigatórios
        function validarFormulario() {
            const campos = ['local', 'especialidade', 'medico', 'data', 'hora'];
            let valido = true;

            campos.forEach(campo => {
                const element = document.getElementById(campo);
                if (!element.value.trim()) {
                    element.closest('.form-field').classList.add('error');
                    valido = false;
                } else {
                    element.closest('.form-field').classList.remove('error');
                    element.closest('.form-field').classList.add('success');
                }
            });

            return valido;
        }

        // Salvar consulta
        function salvarConsulta() {
            if (validarFormulario()) {
                const consulta = {
                    local: document.getElementById('local').value,
                    especialidade: document.getElementById('especialidade').value,
                    medico: document.getElementById('medico').value,
                    data: document.getElementById('data').value,
                    hora: document.getElementById('hora').value,
                    alarme: document.getElementById('alarmToggle').classList.contains('active'),
                    observacoes: document.getElementById('observacoes').value
                };

                console.log('Consulta salva:', consulta);
                alert('✅ Consulta salva com sucesso na agenda!');
                limparFormulario();
            } else {
                alert('⚠️ Por favor, preencha todos os campos obrigatórios');
            }
        }

        // Limpar formulário
        function limparFormulario() {
            document.getElementById('local').value = '';
            document.getElementById('especialidade').value = '';
            document.getElementById('medico').value = '';
            document.getElementById('data').value = '';
            document.getElementById('hora').value = '';
            document.getElementById('observacoes').value = '';
            document.getElementById('alarmToggle').classList.add('active');

            // Remover classes de validação
            document.querySelectorAll('.form-field').forEach(field => {
                field.classList.remove('error', 'success');
            });
        }

        // Toggle do alarme
        function toggleAlarm(button) {
            button.classList.toggle('active');
        }

        // Navegação
        function irParaEmergencia() {
            alert('Redirecionando para tela de Emergência...');
            // window.location.href = '/emergencia.html';
        }

        function irParaInicio() {
            alert('Redirecionando para Tela Home...');
            // window.location.href = '/index.html';
        }

        function digitarConsulta() {
            alert('Modo digitar consulta ativado. O foco será movido para o primeiro campo.');
            document.getElementById('local').focus();
        }

        function escanearEncaminhamento() {
            alert('Abrindo câmera para escanear encaminhamento médico...');
            // Integrar com câmera/scanner aqui
        }

        // Melhorar UX ao clicar nos campos
        document.querySelectorAll('.form-field input, .form-field textarea').forEach(field => {
            field.addEventListener('focus', function() {
                this.closest('.form-field').classList.add('focused');
            });

            field.addEventListener('blur', function() {
                if (!this.value) {
                    this.closest('.form-field').classList.remove('focused', 'success');
                }
            });
        });
    </script>
</body>
